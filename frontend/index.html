<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080C0E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vault" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Vault — финансовый трекер</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html {
      background: #080C0E;
      /* Поддержка safe area на iOS */
      padding-top: env(safe-area-inset-top);
    }
    body {
      margin: 0; padding: 0;
      background: #080C0E;
      /* Убираем лишний padding у body — TopBar сам управляет */
      padding-top: 0 !important;
    }
    #root {
      min-height: 100dvh;
      /* dvh корректно работает на мобилках с адресной строкой */
    }
    /* Скрыть скроллбары везде */
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
